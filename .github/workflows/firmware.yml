name: ESP32 firmware
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade platformio
      - run: cp include/config.example.h include/config.h
      - run: pio run -e xiao_esp32s3
      - run: python -m unittest discover -s tests -p 'test_*.py'

  bambuddy-fork:
    name: Bambuddy fork typed feeder tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout our Bambuddy fork experiment
        uses: actions/checkout@v4
        with:
          repository: Nicco-Male/bambuddy
          ref: feature/tpu-feed-assist-spoolbuddy-poc
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install Bambuddy test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
      - name: Check changed backend Python syntax
        run: |
          python -m compileall -q backend/app/models/spoolbuddy_device.py backend/app/schemas/spoolbuddy.py backend/app/api/routes/spoolbuddy.py backend/app/core/database.py backend/tests/integration/test_spoolbuddy.py
      - name: Run typed feeder backend integration tests
        run: |
          cd backend
          python -m pytest tests/integration/test_spoolbuddy.py -k TestTypedTpuFeederDevices -q --tb=short --timeout=60
      - name: Check Bambuddy frontend TypeScript build
        run: |
          cd frontend
          npm ci
          npm run build
